[package]
name = "parrhesia"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
http = "1"
base64 = "0.22"

[dev-dependencies]
# Real WebSocket client for the end-to-end lifecycle tests. Pinned to the same
# major version axum already pulls in, so the dependency tree stays single-copy.
tokio-tungstenite = "0.24"
